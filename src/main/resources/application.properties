spring.application.name=vahan-alerts
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${VAHAN_DB_URL:jdbc:h2:file:./data/vahanalerts;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${VAHAN_DB_USERNAME:sa}
spring.datasource.password=${VAHAN_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
vahan.documents.max-file-size=${VAHAN_DOCUMENT_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-file-size=${vahan.documents.max-file-size}
spring.servlet.multipart.max-request-size=${VAHAN_DOCUMENT_MAX_REQUEST_SIZE:6MB}
vahan.documents.storage-directory=${VAHAN_DOCUMENT_STORAGE:./data/document-files}
